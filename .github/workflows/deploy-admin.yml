name: Deploy VUZOL admin to Cloudflare

# Publishes the admin panel (admin/) to Cloudflare Pages. Everything is set up
# from GitHub: the Pages project, the D1 database and its tables, the secrets.
#
# Needed in Settings → Secrets and variables → Actions:
#   secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
#            ADMIN_GITHUB_TOKEN (fine-grained token: this repo, Contents read/write, Actions read),
#            ADMIN_SETUP_CODE (any long phrase, used once to create the first admin)
#   variable (optional): ADMIN_DOMAIN, e.g. admin.vuzol.org.ua
# Without CLOUDFLARE_API_TOKEN the workflow just says so and stops.

on:
  push:
    branches: [main]
    paths: ['admin/**', '.github/workflows/deploy-admin.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-deploy
  cancel-in-progress: false

env:
  PROJECT: vuzol-admin
  DB_NAME: vuzol-admin

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare access
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set yet — admin is not deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Install wrangler
        if: steps.check.outputs.ready == 'true'
        run: |
          echo '{"private":true}' > package.json
          npm install --no-save --silent wrangler@4

      - name: Create Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: |
          npx wrangler pages project list --json > /tmp/projects.json
          if ! node -e "process.exit(require('/tmp/projects.json').some(p => (p.name || p['Project Name']) === process.env.PROJECT) ? 0 : 1)"; then
            npx wrangler pages project create "$PROJECT" --production-branch main
          fi

      - name: Create database (first run only) and tables
        if: steps.check.outputs.ready == 'true'
        run: |
          npx wrangler d1 list --json > /tmp/d1.json
          ID=$(node -e "const d=require('/tmp/d1.json').find(x=>x.name===process.env.DB_NAME); process.stdout.write(d ? d.uuid : '')")
          if [ -z "$ID" ]; then
            npx wrangler d1 create "$DB_NAME"
            npx wrangler d1 list --json > /tmp/d1.json
            ID=$(node -e "process.stdout.write(require('/tmp/d1.json').find(x=>x.name===process.env.DB_NAME).uuid)")
          fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 execute "$DB_NAME" --remote --file schema.sql --yes

      - name: Set admin secrets
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
          ADMIN_SETUP_CODE: ${{ secrets.ADMIN_SETUP_CODE }}
        run: |
          if [ -n "$ADMIN_GITHUB_TOKEN" ]; then
            printf '%s' "$ADMIN_GITHUB_TOKEN" | npx wrangler pages secret put GITHUB_TOKEN --project-name "$PROJECT"
          else
            echo "ADMIN_GITHUB_TOKEN is missing: the admin will open but cannot save changes." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ADMIN_SETUP_CODE" ]; then
            printf '%s' "$ADMIN_SETUP_CODE" | npx wrangler pages secret put ADMIN_SETUP_CODE --project-name "$PROJECT"
          fi

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler pages deploy --project-name "$PROJECT" --branch main --commit-dirty=true

      - name: Attach custom domain
        if: steps.check.outputs.ready == 'true' && vars.ADMIN_DOMAIN != ''
        continue-on-error: true
        env:
          ADMIN_DOMAIN: ${{ vars.ADMIN_DOMAIN }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if ! curl -sf -H "$AUTH" "$API/$ADMIN_DOMAIN" > /dev/null; then
            curl -sf -X POST -H "$AUTH" -H "Content-Type: application/json" --data "{\"name\":\"$ADMIN_DOMAIN\"}" "$API" > /dev/null
          fi
          curl -s -H "$AUTH" "$API/$ADMIN_DOMAIN" | node -e "
            const d = JSON.parse(require('fs').readFileSync(0)).result || {};
            const line = 'Domain ' + process.env.ADMIN_DOMAIN + ': ' + (d.status || 'unknown') +
              (d.status === 'active' ? '' : ' — in Imena add CNAME ' + process.env.ADMIN_DOMAIN.split('.')[0] + ' → ' + process.env.PROJECT + '.pages.dev');
            console.log(line);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line + '\n');"

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "Admin deployed: https://$PROJECT.pages.dev" | tee -a "$GITHUB_STEP_SUMMARY"
