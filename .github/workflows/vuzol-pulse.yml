name: Пульс VUZOL у Telegram

on:
  schedule:
    # Щодня о 08:43 за Києвом (06:43 UTC взимку). У понеділок — тижневий звіт.
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto — щоденний, у понеділок тижневий; daily; weekly'
        default: auto
        type: choice
        options: [auto, daily, weekly]

permissions:
  contents: read

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Analytics client
        run: pip install --quiet google-analytics-data==0.18.18
      - name: Send pulse
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          PULSE_MODE: ${{ inputs.mode || 'auto' }}
        run: python .github/scripts/vuzol_pulse.py
