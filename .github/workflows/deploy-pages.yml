name: Deploy VUZOL to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore static site
        run: |
          cat vuzol-site-dist.zip.part-000 vuzol-site-dist.zip.part-001 > /tmp/vuzol-site-dist.zip
          unzip -q /tmp/vuzol-site-dist.zip -d "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/dist/index.html"
          mv "$RUNNER_TEMP/source/dist" "$RUNNER_TEMP/public"

      - name: Build team block from content/team.json
        env:
          PUBLIC_DIR: ${{ runner.temp }}/public
        run: python3 .github/scripts/team_block.py

      - name: Refresh Instagram materials
        if: ${{ env.INSTAGRAM_ACCESS_TOKEN != '' && env.INSTAGRAM_BUSINESS_ACCOUNT_ID != '' }}
        run: |
          curl --fail --silent --show-error --get \
            "https://graph.facebook.com/v27.0/${INSTAGRAM_BUSINESS_ACCOUNT_ID}/media" \
            --data-urlencode "fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp" \
            --data-urlencode "limit=6" \
            --data-urlencode "access_token=${INSTAGRAM_ACCESS_TOKEN}" \
            --output "$RUNNER_TEMP/instagram-response.json"
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/instagram-response.json', 'utf8'));
          const fields = ['id', 'caption', 'media_type', 'media_url', 'thumbnail_url', 'permalink', 'timestamp'];
          const posts = (payload.data || []).slice(0, 6).map((post) =>
            Object.fromEntries(fields.filter((field) => post[field] !== undefined).map((field) => [field, post[field]]))
          );
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/public/assets/instagram-feed.json',
            JSON.stringify(posts)
          );
          NODE

      - name: Report Instagram token expiry
        if: ${{ env.INSTAGRAM_ACCESS_TOKEN != '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          t = os.environ["INSTAGRAM_ACCESS_TOKEN"]
          q = urllib.parse.urlencode({"input_token": t, "access_token": t})
          try:
              d = json.load(urllib.request.urlopen("https://graph.facebook.com/debug_token?" + q, timeout=30))["data"]
          except urllib.error.HTTPError as e:
              err = json.load(e).get("error", {})
              print("debug_token error:", err.get("type"), err.get("code"), err.get("message"))
              raise SystemExit(0)
          def fmt(ts):
              if not ts:
                  return "не закінчується"
              days = int((ts - time.time()) // 86400)
              return "%s (через %d дн.)" % (time.strftime("%Y-%m-%d", time.gmtime(ts)), days)
          lines = [
              "Тип ключа: %s" % d.get("type", "?"),
              "Ключ дійсний: %s" % ("так" if d.get("is_valid") else "НІ"),
              "Ключ діє до: %s" % fmt(d.get("expires_at")),
              "Доступ до даних діє до: %s" % fmt(d.get("data_access_expires_at")),
          ]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Ключ Instagram\n\n" + "\n".join("- " + l for l in lines) + "\n")
          PY

      - name: Fetch (Не)знищені Instagram post image
        if: ${{ env.INSTAGRAM_ACCESS_TOKEN != '' && env.INSTAGRAM_BUSINESS_ACCOUNT_ID != '' }}
        continue-on-error: true
        env:
          RESEARCH_POST_SHORTCODE: DdRP21WgJcL
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ["INSTAGRAM_ACCESS_TOKEN"]
          account = os.environ["INSTAGRAM_BUSINESS_ACCOUNT_ID"]
          code = os.environ["RESEARCH_POST_SHORTCODE"]
          fields = "permalink,media_type,media_url,thumbnail_url,children{media_type,media_url,thumbnail_url}"
          url = "https://graph.facebook.com/v27.0/%s/media?%s" % (account, urllib.parse.urlencode({"fields": fields, "limit": 100, "access_token": token}))
          post = None
          for _ in range(5):
              data = json.load(urllib.request.urlopen(url, timeout=30))
              post = next((m for m in data.get("data", []) if "/" + code + "/" in m.get("permalink", "")), None)
              url = data.get("paging", {}).get("next")
              if post or not url:
                  break
          if not post:
              raise SystemExit("Research post %s not found" % code)
          item = (post.get("children", {}).get("data") or [post])[0]
          image = item.get("thumbnail_url") if item.get("media_type") == "VIDEO" else item.get("media_url")
          if not image:
              raise SystemExit("No image URL for research post")
          target = os.path.join(os.environ["RUNNER_TEMP"], "public", "assets", "research-nezyshcheni.jpg")
          urllib.request.urlretrieve(image, target)
          print("Saved", target, os.path.getsize(target), "bytes")
          PY

      - name: Install compact Instagram preview cards
        run: |
          mkdir -p "$RUNNER_TEMP/public/assets"
          cp .github/scripts/instagram-cards.css "$RUNNER_TEMP/public/assets/instagram-cards.css"
          cp .github/scripts/instagram-cards.js "$RUNNER_TEMP/public/assets/instagram-cards.js"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          html = Path(os.environ["RUNNER_TEMP"]) / "public" / "index.html"
          content = html.read_text(encoding="utf-8")
          version = os.environ.get("GITHUB_SHA", "current")[:12]
          css = f'<link rel="stylesheet" href="assets/instagram-cards.css?v={version}">'
          js = f'<script defer src="assets/instagram-cards.js?v={version}"></script>'
          if css not in content:
              content, n = re.subn(r"</head\s*>", lambda m: css + "\n" + m.group(0), content, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit("Cannot locate </head> to inject Instagram styles")
          if js not in content:
              content, n = re.subn(r"</body\s*>", lambda m: js + "\n" + m.group(0), content, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit("Cannot locate </body> to inject Instagram cards")
          html.write_text(content, encoding="utf-8")
          PY

      - name: Install layout fixes and photo credits
        run: |
          cp .github/scripts/layout-fixes.css "$RUNNER_TEMP/public/assets/layout-fixes.css"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          public = Path(os.environ["RUNNER_TEMP"]) / "public"
          version = os.environ.get("GITHUB_SHA", "current")[:12]
          html = public / "index.html"
          content = html.read_text(encoding="utf-8")
          css = f'<link rel="stylesheet" href="assets/layout-fixes.css?v={version}">'
          if css not in content:
              content, n = re.subn(r"</head\s*>", lambda m: css + "\n" + m.group(0), content, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit("Cannot locate </head> to inject layout fixes")
          # Photo credit for «Жниварські вечорниці».
          content = content.replace(">Фото: Viktoriia<", ">Фото: Вікторія Голотюк<")
          html.write_text(content, encoding="utf-8")
          gallery = public / "zhnyvarski" / "index.html"
          if gallery.exists():
              g = gallery.read_text(encoding="utf-8")
              g = g.replace('rel="noreferrer">Viktoriia</a>', 'rel="noreferrer">Вікторія Голотюк</a>')
              gallery.write_text(g, encoding="utf-8")
          PY

      - name: Add analytics and search tags
        env:
          SITE_URL: https://vuzol.org.ua/
          GA_MEASUREMENT_ID: G-S0JW6ZP942
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, json, os, re
          site = os.environ["SITE_URL"]
          ga = os.environ["GA_MEASUREMENT_ID"]
          public = Path(os.environ["RUNNER_TEMP"]) / "public"
          html = public / "index.html"
          content = html.read_text(encoding="utf-8")
          # Point social previews at the custom domain instead of github.io.
          content = content.replace("https://promedia-ukraine.github.io/vuzol/", site)
          ld = {
              "@context": "https://schema.org",
              "@graph": [
                  {"@type": "Organization", "@id": site + "#org", "name": "VUZOL",
                   "alternateName": ["Вузол", "ВУЗОЛ"], "url": site,
                   "logo": site + "assets/vuzol-social-preview-v2.jpg"},
                  {"@type": "WebSite", "@id": site + "#website", "name": "VUZOL",
                   "alternateName": ["Вузол", "ВУЗОЛ"], "url": site, "inLanguage": "uk",
                   "description": "Медіа про історію української музики.",
                   "publisher": {"@id": site + "#org"}},
              ],
          }
          tags = []
          if "googletagmanager.com/gtag/js" not in content:
              tags.append(
                  f'<script async src="https://www.googletagmanager.com/gtag/js?id={ga}"></script>\n'
                  "<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}"
                  f"gtag('js',new Date());gtag('config','{ga}');</script>"
              )
          if 'rel="canonical"' not in content:
              tags.append(f'<link rel="canonical" href="{site}">')
          if "application/ld+json" not in content:
              tags.append('<script type="application/ld+json">' + json.dumps(ld, ensure_ascii=False) + "</script>")
          if tags:
              block = "\n".join(tags)
              # Keep <meta charset> first, then add the tags right after it.
              content, n = re.subn(r"<meta\s+charset=[^>]*>", lambda m: m.group(0) + "\n" + block, content, count=1, flags=re.I)
              if n != 1:
                  content, n = re.subn(r"<head(\s[^>]*)?>", lambda m: m.group(0) + "\n" + block, content, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit("Cannot locate <head> to inject analytics tags")
          html.write_text(content, encoding="utf-8")
          today = datetime.date.today().isoformat()
          (public / "sitemap.xml").write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'
              f"  <url><loc>{site}</loc><lastmod>{today}</lastmod></url>\n"
              "</urlset>\n",
              encoding="utf-8",
          )
          (public / "robots.txt").write_text(
              f"User-agent: *\nAllow: /\n\nSitemap: {site}sitemap.xml\n", encoding="utf-8"
          )
          PY

      - name: Install image tools
        continue-on-error: true
        run: python3 -m pip install --quiet --break-system-packages pillow

      - name: Polish homepage for search and speed
        continue-on-error: true
        env:
          SITE_URL: https://vuzol.org.ua/
          PUBLIC_DIR: ${{ runner.temp }}/public
        run: python3 .github/scripts/seo_polish.py

      - name: Build YouTube video pages
        continue-on-error: true
        env:
          SITE_URL: https://vuzol.org.ua/
          PUBLIC_DIR: ${{ runner.temp }}/public
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 .github/scripts/youtube_pages.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public

      - id: deployment
        uses: actions/deploy-pages@v4

  keepalive:
    # GitHub disables scheduled workflows in public repositories after 60 days
    # without commits. Re-enabling the workflow resets that counter, so the
    # Instagram refresh keeps running even when the site itself is not edited.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled updates enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/enable" && echo "Scheduled updates kept enabled"
