<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Адмінка VUZOL</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><img src="logo.png" alt="VUZOL"><span>адмінка</span></a>
    <nav id="nav" hidden></nav>
    <div class="who" id="who" hidden>
      <span id="who-name"></span>
      <button class="link" id="btn-password" type="button">Пароль</button>
      <button class="link" id="btn-logout" type="button">Вийти</button>
    </div>
  </header>

  <div class="deploy" id="deploy" hidden></div>

  <main id="app">
    <p class="muted">Завантаження…</p>
  </main>

  <!-- Login -->
  <template id="tpl-login">
    <section class="panel narrow">
      <h1>Вхід</h1>
      <form id="form-login" class="stack">
        <label>Логін <input name="login" autocomplete="username" required autocapitalize="none"></label>
        <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Увійти</button>
        <p class="error" data-error></p>
      </form>
      <p class="muted small">Забули пароль? Попросіть адміністратора адмінки задати новий.</p>
    </section>
  </template>

  <!-- First admin -->
  <template id="tpl-setup">
    <section class="panel narrow">
      <h1>Перший вхід</h1>
      <p class="muted">Створіть обліковий запис адміністратора. Код першого входу — у налаштуваннях репозиторію (секрет <code>ADMIN_SETUP_CODE</code>).</p>
      <form id="form-setup" class="stack">
        <label>Код першого входу <input name="code" required></label>
        <label>Ваше ім’я <input name="name" required></label>
        <label>Логін (латиницею) <input name="login" required autocapitalize="none" pattern="[a-zA-Z0-9._\-]{3,40}"></label>
        <label>Пароль (від 10 символів) <input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
        <button class="btn" type="submit">Створити</button>
        <p class="error" data-error></p>
      </form>
    </section>
  </template>

  <!-- Team -->
  <template id="tpl-team">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h1>Команда</h1>
          <p class="muted">Блок «Команда VUZOL» на сайті. Перетягуйте картки за ⠿ або стрілками, щоб змінити порядок. Після збереження сайт оновиться за 1–3 хвилини.</p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-add" type="button">+ Додати людину</button>
          <button class="btn" id="btn-save" type="button" disabled>Зберегти на сайті</button>
        </div>
      </div>
      <p class="error" id="team-error"></p>
      <ol class="people" id="people"></ol>
    </section>
  </template>

  <template id="tpl-person">
    <li class="person" draggable="true">
      <span class="grip" title="Перетягніть, щоб змінити порядок">⠿</span>
      <button class="avatar" type="button" title="Змінити фото"><img alt=""><span class="avatar-hint">Фото</span></button>
      <div class="fields">
        <input class="f-name" placeholder="Ім’я та прізвище" maxlength="80">
        <input class="f-role" placeholder="Посада / підпис" maxlength="140">
        <input class="f-instagram" placeholder="https://www.instagram.com/…" maxlength="300" inputmode="url">
      </div>
      <div class="row-actions">
        <button class="icon" data-up type="button" title="Вище">↑</button>
        <button class="icon" data-down type="button" title="Нижче">↓</button>
        <button class="icon danger" data-remove type="button" title="Прибрати з сайту">✕</button>
      </div>
    </li>
  </template>

  <!-- Users -->
  <template id="tpl-users">
    <section class="panel">
      <h1>Хто має доступ</h1>
      <p class="muted">Редактор може змінювати блоки сайту. Адміністратор також додає людей до адмінки й скидає паролі.</p>
      <table class="users"><thead><tr><th>Ім’я</th><th>Логін</th><th>Роль</th><th>Останній вхід</th><th></th></tr></thead><tbody id="users"></tbody></table>
      <h2>Додати доступ</h2>
      <form id="form-user" class="grid-form">
        <label>Ім’я <input name="name" required></label>
        <label>Логін (латиницею) <input name="login" required autocapitalize="none" pattern="[a-zA-Z0-9._\-]{3,40}"></label>
        <label>Тимчасовий пароль <input name="password" minlength="10" required></label>
        <label>Роль <select name="role"><option value="editor">Редактор</option><option value="admin">Адміністратор</option></select></label>
        <button class="btn" type="submit">Додати</button>
        <p class="error" data-error></p>
      </form>
      <p class="muted small">Передайте людині логін і пароль особисто й попросіть після входу змінити пароль (кнопка «Пароль» угорі).</p>
    </section>
  </template>

  <!-- Log -->
  <template id="tpl-log">
    <section class="panel">
      <h1>Журнал змін</h1>
      <p class="muted">Останні 50 дій в адмінці. Повна історія змін сайту зберігається в GitHub, звідти будь-яку версію можна повернути.</p>
      <table class="users"><thead><tr><th>Коли (UTC)</th><th>Хто</th><th>Що</th></tr></thead><tbody id="log"></tbody></table>
    </section>
  </template>

  <!-- Photo crop dialog -->
  <dialog id="crop">
    <form method="dialog" class="crop-box">
      <h2>Фото в кружечку</h2>
      <p class="muted small">Перетягніть фото, щоб обличчя було по центру. Повзунком наблизьте чи віддаліть.</p>
      <div class="crop-stage" id="crop-stage"><canvas id="crop-canvas" width="320" height="320"></canvas></div>
      <label class="zoom">Масштаб <input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label>
      <div class="actions">
        <button class="btn ghost" value="cancel">Скасувати</button>
        <button class="btn" value="ok" id="crop-ok">Готово</button>
      </div>
    </form>
  </dialog>

  <!-- Password dialog -->
  <dialog id="pw">
    <form class="crop-box stack" id="form-pw">
      <h2 id="pw-title">Змінити пароль</h2>
      <label data-current>Поточний пароль <input name="current" type="password" autocomplete="current-password"></label>
      <label>Новий пароль (від 10 символів) <input name="password" type="password" minlength="10" autocomplete="new-password" required></label>
      <p class="error" data-error></p>
      <div class="actions">
        <button class="btn ghost" type="button" data-close>Скасувати</button>
        <button class="btn" type="submit">Зберегти</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file" accept="image/*" hidden>
  <script src="app.js" type="module"></script>
</body>
</html>
